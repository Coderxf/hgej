# Nginx 站点配置示例：777713.xyz
# 位置：/etc/nginx/conf.d/hgej-web.conf（或 sites-enabled/ 下，看发行版）
# 要点：/ 反代到 Flask（8090），保留现有 /update/ 静态下载（安卓 APK）

server {
    listen 80;
    server_name 777713.xyz;
    # 若已配 TLS，把下面 server 块合并进 443 的配置即可
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 777713.xyz;

    # 证书路径按实际位置修改（Android 更新下载已用 HTTPS，说明证书已存在）
    ssl_certificate     /etc/nginx/certs/777713.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/777713.xyz.key;

    client_max_body_size 1m;

    # 网页版（Flask 同进程托管静态前端 + API）
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;   # 每日任务接口约 8s，留余量
    }

    # 已有的安卓更新静态目录，保持不动
    location /update/ {
        alias /data/app_update/;
    }
}
